name: rebuild-images

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push rebuilt images (otherwise build and verify only)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  ECR_REGISTRY: public.ecr.aws

jobs:
  rebuild:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { repository: rails-base, tag: '3.1.4' }
          - { repository: rails-base, tag: '3.2.1' }
          - { repository: rails-base, tag: '3.2.2' }
          - { repository: rails-base, tag: '3.2.3' }
          - { repository: rails-base, tag: '3.2.4' }
          - { repository: rails-base, tag: '3.2.6' }
          - { repository: rails-base, tag: '3.2.8' }
          - { repository: rails-base, tag: '3.2.9' }
          - { repository: rails-base, tag: '3.2.11' }
          - { repository: rails-base, tag: '3.3.1' }
          - { repository: rails-base, tag: '3.3.7' }
          - { repository: rails-base, tag: '3.3.8' }
          - { repository: rails-base, tag: '3.3.10' }
          - { repository: rails-base, tag: '3.3.11' }
          - { repository: rails-base, tag: '3.3.13' }
          - { repository: rails-base, tag: '3.4.0' }
          - { repository: rails-base, tag: '3.4.1' }
          - { repository: rails-base, tag: '3.4.2' }
          - { repository: rails-base, tag: '3.4.3' }
          - { repository: rails-base, tag: '3.4.5' }
          - { repository: rails-base, tag: '3.4.8' }
          - { repository: rails-base, tag: '3.4.9' }
          - { repository: rails-base, tag: '3.4.11' }
          - { repository: rails-base, tag: '3.4.12' }
          - { repository: rails-base, tag: '4.0.0' }
          - { repository: rails-base, tag: '4.0.1' }
          - { repository: rails-base, tag: '4.0.2' }
          - { repository: rails-base, tag: '4.0.3' }
          - { repository: rails-base, tag: '4.0.5' }
          - { repository: rails-base, tag: '4.0.6' }
          - { repository: rails-base, tag: '4.0.7' }
          - { repository: rails-base, tag: '4.0.8' }
          - { repository: rails-base, tag: '4.0.9' }
          - { repository: rails-buildpack, tag: '2.7' }
          - { repository: rails-buildpack, tag: '2.7.3' }
          - { repository: rails-buildpack, tag: '2.7.5' }
          - { repository: rails-buildpack, tag: '2.7.7' }
          - { repository: rails-buildpack, tag: '3.0' }
          - { repository: rails-buildpack, tag: '3.1' }
          - { repository: rails-buildpack, tag: '3.1.4' }
          - { repository: rails-buildpack, tag: '3.2.1' }
          - { repository: rails-buildpack, tag: '3.2.2' }
          - { repository: rails-buildpack, tag: '3.2.3' }
          - { repository: rails-buildpack, tag: '3.2.4' }
          - { repository: rails-buildpack, tag: '3.2.6' }
          - { repository: rails-buildpack, tag: '3.2.8' }
          - { repository: rails-buildpack, tag: '3.2.9' }
          - { repository: rails-buildpack, tag: '3.2.11' }
          - { repository: rails-buildpack, tag: '3.3.0' }
          - { repository: rails-buildpack, tag: '3.3.1' }
          - { repository: rails-buildpack, tag: '3.3.8' }
          - { repository: rails-buildpack, tag: '3.3.10' }
          - { repository: rails-buildpack, tag: '3.3.11' }
          - { repository: rails-buildpack, tag: '3.3.13' }
          - { repository: rails-buildpack, tag: '3.4.0' }
          - { repository: rails-buildpack, tag: '3.4.1' }
          - { repository: rails-buildpack, tag: '3.4.2' }
          - { repository: rails-buildpack, tag: '3.4.3' }
          - { repository: rails-buildpack, tag: '3.4.5' }
          - { repository: rails-buildpack, tag: '3.4.8' }
          - { repository: rails-buildpack, tag: '3.4.9' }
          - { repository: rails-buildpack, tag: '3.4.11' }
          - { repository: rails-buildpack, tag: '3.4.12' }
          - { repository: rails-buildpack, tag: '4.0.0' }
          - { repository: rails-buildpack, tag: '4.0.1' }
          - { repository: rails-buildpack, tag: '4.0.2' }
          - { repository: rails-buildpack, tag: '4.0.3' }
          - { repository: rails-buildpack, tag: '4.0.5' }
          - { repository: rails-buildpack, tag: '4.0.6' }
          - { repository: rails-buildpack, tag: '4.0.7' }
          - { repository: rails-buildpack, tag: '4.0.8' }
          - { repository: rails-buildpack, tag: '4.0.9' }
    runs-on: ubuntu-latest
    env:
      IMAGE: public.ecr.aws/degica/${{ matrix.repository }}
      TAG: ${{ matrix.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials for Public ECR
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.PUBLIC_ECR_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Public ECR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.ECR_REGISTRY }}

      - name: Resolve source image
        id: source
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "Rebuilding $IMAGE:$TAG ($DIGEST)"
          echo "image=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Check source image against compromised eMudhra certificate
        run: docker run --rm -v "$PWD/rebuild-images/verify-emudhra.sh:/verify.sh:ro" "${{ steps.source.outputs.image }}" sh /verify.sh

      - name: Build patched image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg SOURCE_IMAGE="${{ steps.source.outputs.image }}" \
            -f rebuild-images/patch.Dockerfile \
            -t "$IMAGE:$TAG" \
            rebuild-images

      - name: Verify patched image against compromised eMudhra certificate
        run: docker run --rm -v "$PWD/rebuild-images/verify-emudhra.sh:/verify.sh:ro" "$IMAGE:$TAG" sh /verify.sh

      - name: Verify libbrotli version in patched image
        run: docker run --rm -v "$PWD/rebuild-images/verify-brotli.sh:/verify.sh:ro" "$IMAGE:$TAG" sh /verify.sh

      - name: Push patched image
        if: inputs.push
        run: docker push "$IMAGE:$TAG"
