name: build-rails-base

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-rails-base.yml'
      - '**/Dockerfile'

permissions:
  contents: read
  id-token: write

env:
  ECR_REGISTRY: public.ecr.aws
  ECR_REPOSITORY: degica/rails-base

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.2.11'
            folder: '3.x' # slim bookworm for linux/amd64
            tag: '3.2.11-slim-bookworm@sha256:1bb3b14e4cbf883f50c92bf48efdeea2126e5a2de4764c13cd7b78fb36e71052'
          - ruby: '3.3.13'
            folder: '3.x' # slim bookworm for linux/amd64
            tag: '3.3.13-slim-bookworm@sha256:885142fb5138e80bd09fc81a7799356c967e28c97da6a710c74a23c5f39830f1'
          - ruby: '3.4.12'
            folder: '3.x' # slim bookworm for linux/amd64
            tag: '3.4.12-slim-bookworm@sha256:763447970212036899305a7fbcf2ac67d501671e050b53e4ea998d18c62ce71a'
          - ruby: '4.0.9'
            folder: '4.x' # slim bookworm for linux/amd64
            tag: '4.0.9-slim-bookworm@sha256:3fbe94d9407cf1feb42ba4285e857fa0a3ca970d77c0dc400d425af83852891a'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Configure AWS credentials for Public ECR
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.PUBLIC_ECR_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Public ECR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.ECR_REGISTRY }}

      - name: Construct image tag
        id: image-tag
        run: |
          if [[ ${GITHUB_REF##*/} == 'master' ]]; then
            echo "tag=${{ matrix.ruby }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=test-${GITHUB_REF##*/}-${{ matrix.ruby }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push container image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          provenance: false
          context: "{{defaultContext}}:rails-base/${{ matrix.folder }}"
          build-args: RUBY_TAG=${{ matrix.tag }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}
