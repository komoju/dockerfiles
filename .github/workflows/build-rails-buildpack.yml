name: build-rails-buildpack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-rails-buildpack.yml'
      - '**/Dockerfile'

permissions:
  contents: read
  id-token: write

env:
  ECR_REGISTRY: public.ecr.aws
  ECR_REPOSITORY: degica/rails-buildpack

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.2.11'
            folder: '3.x' # bookworm for linux/amd64
            tag: '3.2.11-bookworm@sha256:d68250c0e3974511b6b8d489afb9a5e8e45aadd41dd841f6e035f7c4c03f1a54'
          - ruby: '3.3.11'
            folder: '3.x' # bookworm for linux/amd64
            tag: '3.3.11-bookworm@sha256:cdf1bbc7daaef640c62e834fa624c831b00ebb2dbf0b522e3bc43db97aa878c7'
          - ruby: '3.4.11'
            folder: '3.x' # bookworm for linux/amd64
            tag: '3.4.11-bookworm@sha256:246b2dc3f6e40bba3af18503c22997a34dbb27c9f97e198dde6dd727895115c5'
          - ruby: '4.0.7'
            folder: '4.x' # bookworm for linux/amd64
            tag: '4.0.7-bookworm@sha256:119a36c51c7893215202220eabfdcb561638735de4d45bacf2e8619be3de47f2'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Configure AWS credentials for Public ECR
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.PUBLIC_ECR_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Public ECR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.ECR_REGISTRY }}

      - name: Construct image tag
        id: image-tag
        run: |
          if [[ ${GITHUB_REF##*/} == 'master' ]]; then
            echo "tag=${{ matrix.ruby }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=test-${GITHUB_REF##*/}-${{ matrix.ruby }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push container image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          provenance: false
          context: "{{defaultContext}}:rails-buildpack/${{ matrix.folder }}"
          build-args: RUBY_TAG=${{ matrix.tag }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
